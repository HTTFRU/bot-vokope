<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrenchBot - Автоматизация игры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #161922;
            --accent-green: #00c853;
            --accent-orange: #ff9100;
            --border-color: #2a2e3d;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--border-color); margin-bottom: 12px;
        }

        .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #a855f7; }

        .input-box {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 10px; margin-bottom: 12px;
        }
        .input-title { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: bold; }
        
        textarea {
            width: 100%; height: 50px; background: #0b0d12; border: 1px solid var(--border-color);
            color: #fff; padding: 8px; border-radius: 6px; font-size: 11px; resize: none; margin-bottom: 8px;
        }

        .btn-sync {
            width: 100%; background: #112a18; color: #00e676; border: 1px solid #00c853;
            padding: 10px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold;
        }

        .sync-status {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; text-align: center;
        }
        .sync-status.success { border-color: #00c853; color: #00c853; }
        .sync-status.error { border-color: #ff4d4f; color: #ff4d4f; }

        .section-title { font-size: 13px; font-weight: bold; color: var(--text-muted); margin-bottom: 8px; margin-top: 12px; }

        .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
        .res-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: center; }
        .res-title { font-size: 11px; color: var(--text-muted); }
        .res-val { font-size: 15px; font-weight: bold; margin-top: 4px; color: var(--accent-orange); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <span>👤</span>
            <span id="username">@xuyundz</span>
        </div>
        <span style="font-size: 11px; color: var(--text-muted);">Панель управления</span>
    </div>

    <div class="input-box">
        <div class="input-title">🔐 Bearer Токен авторизации:</div>
        <textarea id="initdata-input" placeholder="Bearer 25a3ddbc..."></textarea>
        <button class="btn-sync" onclick="syncWithGame()">🔄 Синхронизировать с игрой</button>
    </div>

    <div class="sync-status" id="sync-banner">
        ⏳ Ожидание синхронизации...
    </div>

    <div class="section-title">📦 Основные ресурсы и валюты</div>
    <div class="res-grid">
        <div class="res-box">
            <div class="res-title">⛽ Топливо</div>
            <div class="res-val" id="res-fuel">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">🏷 Жетоны</div>
            <div class="res-val" id="res-tokens">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">🎟 Талоны</div>
            <div class="res-val" id="res-coupons">--</div>
        </div>
    </div>

    <div class="res-grid">
        <div class="res-box">
            <div class="res-title">✉️ Депеши</div>
            <div class="res-val" id="res-letters">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">🍞 Провизия</div>
            <div class="res-val" id="res-food">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">🧨 Гильзы</div>
            <div class="res-val" id="res-shells">--</div>
        </div>
    </div>

    <div class="res-grid">
        <div class="res-box">
            <div class="res-title">📜 Облигации</div>
            <div class="res-val" id="res-bonds">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">💣 Порох</div>
            <div class="res-val" id="res-powder">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">🎖 Уровень</div>
            <div class="res-val" id="res-level" style="color: #00e676;">--</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:8000"; 

        async function syncWithGame() {
            const banner = document.getElementById('sync-banner');
            const initDataVal = document.getElementById('initdata-input').value.trim();

            if (!initDataVal) {
                banner.className = 'sync-status error';
                banner.innerText = '❌ Поле токена пустое!';
                return;
            }

            banner.className = 'sync-status';
            banner.innerText = '🔄 Синхронизация с сервером игры...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: initDataVal })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    banner.className = 'sync-status success';
                    banner.innerText = '✅ Синхронизация успешна!';

                    if (result.game_data) {
                        const d = result.game_data;
                        // Безопасное заполнение полей из ответа сервера (поддерживаем разные варианты ключей)
                        document.getElementById('res-fuel').innerText = d.fuel ?? d.energy ?? '0';
                        document.getElementById('res-tokens').innerText = d.tokens ?? d.jetons ?? '0';
                        document.getElementById('res-coupons').innerText = d.coupons ?? '0';
                        document.getElementById('res-letters').innerText = d.letters ?? d.messages ?? '0';
                        document.getElementById('res-food').innerText = d.food ?? d.provisions ?? '0';
                        document.getElementById('res-shells').innerText = d.shells ?? d.bullets ?? '0';
                        document.getElementById('res-bonds').innerText = d.bonds ?? '0';
                        document.getElementById('res-powder').innerText = d.powder ?? '0';
                        document.getElementById('res-level').innerText = d.level ?? '1';
                    }
                } else {
                    banner.className = 'sync-status error';
                    banner.innerText = result.message;
                }
            } catch (err) {
                banner.className = 'sync-status error';
                banner.innerText = '⚠️ Ошибка: Сервер Python (server.py) не запущен!';
            }
        }
    </script>
</body>
</html>
