<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrenchBot - Ручной ввод InitData</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #161922;
            --accent-green: #00c853;
            --accent-orange: #ff9100;
            --border-color: #2a2e3d;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--border-color); margin-bottom: 12px;
        }

        .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #a855f7; }

        /* Блок ручного ввода */
        .input-box {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 10px; margin-bottom: 12px;
        }
        .input-title { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: bold; }
        
        textarea {
            width: 100%; height: 70px; background: #0b0d12; border: 1px solid var(--border-color);
            color: #fff; padding: 8px; border-radius: 6px; font-size: 11px; resize: none; margin-bottom: 8px;
        }

        .btn-sync {
            width: 100%; background: #112a18; color: #00e676; border: 1px solid #00c853;
            padding: 10px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold;
        }

        .sync-status {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; text-align: center;
        }
        .sync-status.success { border-color: #00c853; color: #00c853; }
        .sync-status.error { border-color: #ff4d4f; color: #ff4d4f; }

        .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .res-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: center; }
        .res-title { font-size: 11px; color: var(--text-muted); }
        .res-val { font-size: 15px; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <span>👤</span>
            <span id="username">@user</span>
        </div>
        <span style="font-size: 11px; color: var(--text-muted);">Ручной режим</span>
    </div>

    <!-- Поле для ручной вставки initData -->
    <div class="input-box">
        <div class="input-title">🔐 Вставьте Telegram initData:</div>
        <textarea id="initdata-input" placeholder="query_id=...&user=...&hash=..."></textarea>
        <button class="btn-sync" onclick="syncWithGame()">🔄 Синхронизировать с игрой</button>
    </div>

    <div class="sync-status" id="sync-banner">
        ⏳ Ожидание ввода данных...
    </div>

    <div class="res-grid">
        <div class="res-box">
            <div class="res-title">⚡ Энергия</div>
            <div class="res-val" id="res-energy">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">🪙 Золото</div>
            <div class="res-val" id="res-gold">--</div>
        </div>
        <div class="res-box">
            <div class="res-title">🎖 Уровень</div>
            <div class="res-val" id="res-level">--</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "http://localhost:8000"; 

        // Автоматически подставляем из Telegram, если открыто внутри мессенджера
        window.onload = function() {
            if (tg.initData) {
                document.getElementById('initdata-input').value = tg.initData;
            }
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('username').innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
            }
        };

        async function syncWithGame() {
            const banner = document.getElementById('sync-banner');
            const initDataVal = document.getElementById('initdata-input').value.trim();

            if (!initDataVal) {
                banner.className = 'sync-status error';
                banner.innerText = '❌ Поле initData пустое!';
                return;
            }

            banner.className = 'sync-status';
            banner.innerText = '🔄 Отправка запроса на сервер игры...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: initDataVal })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    banner.className = 'sync-status success';
                    banner.innerText = '✅ Синхронизация успешна!';

                    if (result.game_data) {
                        const state = result.game_data;
                        document.getElementById('res-energy').innerText = state.energy || state.stamina || '100';
                        document.getElementById('res-gold').innerText = state.gold || state.money || '0';
                        document.getElementById('res-level').innerText = state.level || '1';
                    }
                } else {
                    banner.className = 'sync-status error';
                    banner.innerText = result.message;
                }
            } catch (err) {
                banner.className = 'sync-status error';
                banner.innerText = '⚠️ Ошибка: Сервер Python (server.py) не запущен!';
            }
        }
    </script>
</body>
</html>
